<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Digital Agtech Indonesia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>

<div class="auth-page">

  <!-- Left: image + branding -->
  <div class="auth-left">
    <img class="auth-left-img" src="assets/img/gallery-1.jpg" alt="Peserta Digital Agtech Indonesia">
    <div class="auth-left-overlay"></div>
    <div class="auth-left-content">
      <h1 class="auth-left-headline">Build. <em>Learn.</em>Grow.</h1>
      <p class="auth-left-sub">Join the AgTech ecosystem and discover opportunities to learn, connect, and grow your startup.</p>
    </div>
  </div>

  <!-- Right: form -->
  <div class="auth-right">

    <!-- Tabs -->
    <nav class="auth-tabs">
      <a href="login.html" class="auth-tab active">Login</a>
      <a href="register.html" class="auth-tab">Register</a>
    </nav>

    <!-- Form -->
    <div class="auth-body">
      <div class="auth-header">
        <div class="auth-title-wrap">
          <h2 class="auth-title">Welcome back</h2>
          <p class="auth-subtitle">Continue your journey with us</p>
        </div>
        <a href="landing.html" class="auth-home-icon" aria-label="Ke halaman utama">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </a>
      </div>

      <form action="#" method="post" novalidate>

        <div class="field">
          <label class="field-label" for="email">Email Address <span class="req">*</span></label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
            </span>
            <input type="email" id="email" name="email" placeholder="you@company.com" autocomplete="email" required>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="password">Password <span class="req">*</span></label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" class="has-eye" required>
            <button type="button" class="input-eye" onclick="toggleEye('password', this)" aria-label="Tampilkan password">
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C7 20 2.73 16.39 1 11a10.94 10.94 0 0 1 2.06-3.94M6.53 6.53A10.88 10.88 0 0 1 12 4c5 0 9.27 3.61 11 9a10.95 10.95 0 0 1-1.33 2.79M1 1l22 22"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M1 12C2.73 6.61 7 3 12 3s9.27 3.61 11 9c-1.73 5.39-6 9-11 9S2.73 17.39 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="check-row">
          <input type="checkbox" id="remember" name="remember">
          <label for="remember">Remember me</label>
        </div>

        <button type="submit" class="btn-auth">Login</button>

      </form>
    </div>

  </div>
</div>

<script>
function toggleEye(inputId, btn) {
  const input = document.getElementById(inputId);
  const isText = input.type === 'text';
  input.type = isText ? 'password' : 'text';
  btn.querySelector('.eye-off').style.display = isText ? '' : 'none';
  btn.querySelector('.eye-on').style.display  = isText ? 'none' : '';
}
</script>

</body>
</html>
