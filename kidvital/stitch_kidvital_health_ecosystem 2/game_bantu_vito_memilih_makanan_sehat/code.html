<style>
        .block-shadow-primary {
            box-shadow: 0 6px 0 0 #D1A500;

        .block-shadow-primary:active {

            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); }
        }
        .floating-fox {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ffdf9f;

            z-index: 100;

<span class="material-symbols-outlined text-on-primary-container" style="font-variation-settings: 'FILL' 1;">star</span>

<span class="font-headline-sm text-on-primary-container ml-2" id="score-text">3</span>

<h1 class="font-display-lg-mobile text-2xl md:text-4xl text-primary text-center mt-2 mb-stack-sm md:mb-stack-md leading-tight">Bantu Vito Pilih Makanan Sehat</h1>

</div>
<img class="w-full h-auto floating-fox" data-alt="A friendly and cheerful cartoon fox mascot named Vito with large expressive eyes, a cute orange coat, and a blue bandana, standing in a playful pose suitable for a children's mobile game. The character is rendered in a flat, high-contrast illustration style with bold outlines and vibrant colors that fit a playful digital playground aesthetic." src="https://lh3.googleusercontent.com/aida/AP1WRLse5OjIRg1SQi6t6MFj_SnVhE_uPQiZq6Mm-VvjJlvA9jNYdxHQ8kJu8jjOd050q4dBAzyek5jYZUoljw7Lo7uzwyBQyYYztBwVQVVNAYQyLwRM2Ez5ijpI44RHznO_r_Q7gPNZoOwFyk_SEiiyXS4Pxbo2oyqWNPtRIBtCmFOxvWj6RH5C-dKY2C0FNmQJ2qhvFtkH8n2DnvmcGauNdFXp-96R7uz2qiC4HP6EwkSOL9_JC8I1BcRwlQ">
</div>

</div>
</div>

<script>
        let score = 3;
        const scoreText = document.getElementById('score-text');
        const plateContent = document.getElementById('plate-content');
        const emptyPlateText = document.getElementById('empty-plate-text');
        const starContainer = document.getElementById('star-container');

        const foodIcons = {
            apple: { icon: 'nutrition', color: 'text-red-500' },
            broccoli: { icon: 'eco', color: 'text-green-600' },
            carrot: { icon: 'restaurant', color: 'text-orange-500' },
            milk: { icon: 'water_full', color: 'text-blue-500' },
            chicken: { icon: 'lunch_dining', color: 'text-yellow-700' }
        };

        function addFood(type, isHealthy, element) {
            if (isHealthy) {
                // Remove empty text
                if (emptyPlateText) emptyPlateText.style.display = 'none';

                // Add food to plate
                const foodItem = document.createElement('div');
                foodItem.className = 'w-16 h-16 bg-surface-container-low rounded-full flex items-center justify-center star-animate border-2 border-outline-variant';
                foodItem.innerHTML = `<span class="material-symbols-outlined text-3xl ${foodIcons[type].color}" style="font-variation-settings: 'FILL' 1;">${foodIcons[type].icon}</span>`;
                plateContent.appendChild(foodItem);

                // Update Score
                score++;
                scoreText.innerText = score;

                // Star Animation in counter
                const newStar = document.createElement('span');
                newStar.className = 'material-symbols-outlined text-primary star-animate';
                newStar.style.fontVariationSettings = "'FILL' 1";
                newStar.innerText = 'star';
                starContainer.appendChild(newStar);
                
                // Cleanup star
                setTimeout(() => {
                    if (starContainer.children.length > 5) {
                        starContainer.removeChild(starContainer.children[0]);
                    }
                }, 500);

                // Confetti effect
                createConfetti(element);
                
                // Audio placeholder (haptic feedback)
                if (window.navigator.vibrate) window.navigator.vibrate(50);
            } else {
                // Shake effect for wrong item
                element.classList.add('bg-error-container', 'border-error');
                setTimeout(() => {
                    element.classList.remove('bg-error-container', 'border-error');
                }, 500);
            }
        }

        function createConfetti(element) {
            const rect = element.getBoundingClientRect();
            for (let i = 0; i < 8; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = (rect.left + rect.width / 2) + 'px';
                confetti.style.top = (rect.top + rect.height / 2) + 'px';
                confetti.style.backgroundColor = ['#FFC94D', '#6FCF97', '#56CCF2', '#ba1a1a'][Math.floor(Math.random() * 4)];
                document.body.appendChild(confetti);

                const angle = Math.random() * Math.PI * 2;
                const velocity = 5 + Math.random() * 10;
                const vx = Math.cos(angle) * velocity;
                const vy = Math.sin(angle) * velocity;

                let posX = rect.left + rect.width / 2;
                let posY = rect.top + rect.height / 2;
                let opacity = 1;

                const animate = () => {
                    posX += vx;
                    posY += vy;
                    opacity -= 0.02;
                    confetti.style.left = posX + 'px';
                    confetti.style.top = posY + 'px';
                    confetti.style.opacity = opacity;

                    if (opacity > 0) {
                        requestAnimationFrame(animate);
                    } else {
                        confetti.remove();
                    }
                };
                requestAnimationFrame(animate);
            }
        }
    </script>
