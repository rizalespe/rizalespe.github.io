<!-- Simple inline script for subtle entrance animation -->
<script>
        document.addEventListener("DOMContentLoaded", () => {
            const contentArea = document.querySelector('.animate-fade-in-up');
            if(contentArea) {
                contentArea.style.opacity = '0';
                contentArea.style.transform = 'translateY(20px)';
                contentArea.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out';
                
                requestAnimationFrame(() => {
                    contentArea.style.opacity = '1';
                    contentArea.style.transform = 'translateY(0)';
                });
            }
        });
    </script>
